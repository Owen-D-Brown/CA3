<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Landing</title>
</head>
<body>
<main>
    <h1>Welcome</h1>
    <p>Sign in to access your account.</p>
    {% if session.get("user_id") %}
        <form method="get" action="{{ url_for('get_user_home') }}">
            <button type="submit">Go to Home</button>
        </form>
    {% else %}
        <form method="get" action="{{ url_for('get_login') }}">
            <button type="submit">Go to Login</button>
        </form>
        <form method="get" action="{{ url_for('get_signup') }}">
            <button type="submit">Sign Up</button>
        </form>
    {% endif %}
</main>
</body>
</html>
