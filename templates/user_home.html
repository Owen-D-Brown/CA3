<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
</head>
<body>
<main>
  <h1>Welcome, {{ user.username }}</h1>

  <dl>
    <dt>User ID</dt>
    <dd>{{ user.id }}</dd>

    <dt>Username</dt>
    <dd>{{ user.username }}</dd>

    <dt>Email</dt>
    <dd>{{ user.email }}</dd>

    <dt>Profile Visibility</dt>
    <dd>{{ "Public" if user.is_public else "Private" }}</dd>
  </dl>

  <form method="get" action="{{ url_for('get_logout') }}">
    <button type="submit">Logout</button>
  </form>
  <form method="get" action="{{ url_for('landing_page') }}">
    <button type="submit">Home</button>
  </form>
</main>
</body>
</html>
